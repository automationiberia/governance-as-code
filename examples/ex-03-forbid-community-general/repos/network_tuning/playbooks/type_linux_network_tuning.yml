---
- name: Tune network settings on production nodes
  hosts: prod_linux
  become: true
  vars:
    network_tuning_sysctl:
      - {name: net.core.somaxconn, value: "4096"}
      - {name: net.ipv4.tcp_syncookies, value: "1"}
  tasks:
    - name: Allow HTTPS through firewalld
      ansible.posix.firewalld:
        service: https
        permanent: true
        immediate: true
        state: enabled

    - name: Set network kernel parameters
      ansible.posix.sysctl:
        name: "{{ network_tuning_param.name }}"
        value: "{{ network_tuning_param.value }}"
        sysctl_set: true
      loop: "{{ network_tuning_sysctl }}"
      loop_control:
        loop_var: network_tuning_param
        label: "{{ network_tuning_param.name }}"

    - name: Report the parameters that were set
      ansible.builtin.debug:
        msg: "{{ network_tuning_sysctl | map(attribute='name') | list }}"
