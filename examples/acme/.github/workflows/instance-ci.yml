# CI for the acme governance instance itself.
# Organization lint rules are code: every change runs their fixtures.
name: instance-ci

"on":
  pull_request:
  push:
    branches: [main]

jobs:
  rule-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the instance
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install checker and test runner
        run: pip install "ansible-lint==26.10.1" pytest

      - name: Run organization rule fixtures
        run: pytest gates/rules/tests

      - name: Exception watch (Evolution slot, ADR-0014)
        run: python gates/checks/exception_watch.py
