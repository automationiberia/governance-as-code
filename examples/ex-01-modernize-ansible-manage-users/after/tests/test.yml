---
# Functional and idempotency test for manage_users.
# Run twice against a disposable host: the second run must report changed=0.
# Precondition: the host has a user "olduser" and a group "oldgroup" to remove.
- name: Test manage_users — create groups and users, apply password policy
  hosts: all
  gather_facts: false
  vars:
    manage_users_add_groups: true
    manage_users_add_users: true
    manage_users_set_password_policy: true
    manage_users_password_policy: force_change_non_expiring
    manage_users_password: "test-only-not-a-real-secret"  # test fixture only
    manage_users_groups:
      oinstall: {gid: 1200}
      dba: {gid: 1205}
    manage_users_users:
      oracle: {uid: 9000, group: 1200, groups: "1205", com: "User Oracle"}
      orainfra: {uid: 1220, group: 1200, com: "User Oracle-Infra"}
  roles:
    - role: manage_users

- name: Test manage_users — remove a user and a group
  hosts: all
  gather_facts: false
  vars:
    manage_users_delete_users: true
    manage_users_delete_groups: true
    manage_users_users_absent:
      olduser: {}
    manage_users_groups_absent:
      oldgroup: {}
  roles:
    - role: manage_users
