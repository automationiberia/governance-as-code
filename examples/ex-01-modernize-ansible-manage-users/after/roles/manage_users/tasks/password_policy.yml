---
- name: Password_policy | Remove password aging and account expiry
  ansible.builtin.user:
    name: "{{ __manage_users_user.key }}"
    password_expire_min: 0
    password_expire_max: 99999
    expires: -1
  loop: "{{ manage_users_users | dict2items }}"
  loop_control:
    loop_var: __manage_users_user
    label: "{{ __manage_users_user.key }}"
  when: manage_users_password_policy in ['force_change_non_expiring', 'non_expiring']
  tags: manage_users_password_policy

- name: Password_policy | Read shadow entries
  ansible.builtin.getent:
    database: shadow
  when: manage_users_password_policy in ['force_change_non_expiring', 'non_expiring']
  tags: manage_users_password_policy

# No module provides this idempotently (ACME ADR-0004): ansible.builtin.user
# sets inactivity with "usermod -f" on every run. Run "chage -I -1" only when
# the shadow entry still has an inactivity period (getent field index 5).
- name: Password_policy | Disable password inactivity period
  ansible.builtin.command:
    argv: [chage, -I, "-1", "{{ __manage_users_user.key }}"]
  changed_when: true
  loop: "{{ manage_users_users | dict2items }}"
  loop_control:
    loop_var: __manage_users_user
    label: "{{ __manage_users_user.key }}"
  when:
    - manage_users_password_policy in ['force_change_non_expiring', 'non_expiring']
    - ansible_facts.getent_shadow[__manage_users_user.key][5] not in ['', '-1']
  tags: manage_users_password_policy

# No module provides this (ACME ADR-0004): ansible.builtin.user cannot set the
# last password change date ("chage -d 0"). Applied only to users created in
# this run, so it does not repeat on later runs.
- name: Password_policy | Force password change at next login for new users
  ansible.builtin.command:
    argv: [chage, -d, "0", "{{ __manage_users_new_user }}"]
  changed_when: true
  loop: "{{ __manage_users_new_users | default([]) }}"
  loop_control:
    loop_var: __manage_users_new_user
  when: manage_users_password_policy in ['force_change', 'force_change_non_expiring']
  tags: manage_users_password_policy
